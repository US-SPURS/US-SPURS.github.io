name: Quality gates

on:
  pull_request:
    branches: [main]
  push:
    branches: ['feature/**']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Type, source policy, build, and link validation
        run: npm run check
