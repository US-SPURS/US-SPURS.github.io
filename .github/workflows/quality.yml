name: Quality gates

on:
  pull_request:
    branches: [main]
  push:
    branches: ['feature/**']

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm install
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build

  accessibility:
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run build
      - name: Serve exported site
        run: npx serve out -l 4173 &
      - name: Run axe against homepage
        run: npx @axe-core/cli http://127.0.0.1:4173 --exit
