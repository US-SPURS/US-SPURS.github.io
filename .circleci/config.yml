version: 2.1

# =============================================================================
# US-SPURS.github.io — CircleCI Validation Pipeline
# -----------------------------------------------------------------------------
# Repo:    https://github.com/US-SPURS/US-SPURS.github.io
# Stack:   Next.js 16 (static export, output: 'export') + React 19 + TypeScript
#          + Playwright (@playwright/test, @axe-core/playwright)
# Node:    >=22.0.0 (per package.json "engines")
#
# Role of this pipeline:
#   GitHub Pages deployment is already handled by .github/workflows/deploy.yml
#   on push to `main`. This CircleCI pipeline does NOT deploy — it is an
#   independent validation gate (typecheck, source-policy lint, static export
#   build, link + artifact integrity, and cross-viewport E2E/accessibility
#   testing) that mirrors and extends `npm run check`, giving a second CI
#   signal ahead of merge.
#
# Assumptions made explicit (repo scripts under scripts/*.mjs were not
# inspectable from outside the repo — confirm these hold and adjust if not):
#   - check:links / check:artifacts (scripts/check-links.mjs,
#     scripts/check-artifacts.mjs) operate on the static `out/` directory
#     produced by `npm run build` and require no running server.
#   - playwright.config.ts defines no `webServer`, and its baseURL is
#     http://127.0.0.1:4173 — so this pipeline serves `out/` on :4173 itself
#     via `npx serve` before running `npm run test:e2e`.
#   - playwright.config.ts only defines chromium projects (desktop-chromium,
#     mobile-chromium) — only the Chromium browser is installed.
# =============================================================================

executors:
  node-executor:
    docker:
      - image: cimg/node:22.11
    working_directory: ~/us-spurs-site
    resource_class: medium
    environment:
      NEXT_TELEMETRY_DISABLED: "1"
      CI: "true"

commands:
  install_node_modules:
    description: "Restore npm cache (if present), install deps via npm ci, save cache"
    steps:
      - restore_cache:
          keys:
            - v1-npm-deps-{{ checksum "package-lock.json" }}
            - v1-npm-deps-
      - run:
          name: Install dependencies (npm ci)
          command: npm ci
      - save_cache:
          key: v1-npm-deps-{{ checksum "package-lock.json" }}
          paths:
            - ~/.npm
            - node_modules

  attach_and_prepare:
    description: "Attach the shared workspace produced by the setup job"
    steps:
      - attach_workspace:
          at: ~/us-spurs-site

jobs:
  # ---------------------------------------------------------------------------
  # setup — checkout, install dependencies once, share via workspace
  # ---------------------------------------------------------------------------
  setup:
    executor: node-executor
    steps:
      - run:
          name: Checkout code via HTTPS
          command: |
            git clone --filter=blob:none \
              https://github.com/US-SPURS/US-SPURS.github.io.git \
              .
            git checkout "$CIRCLE_SHA1"
      - install_node_modules
      - persist_to_workspace:
          root: ~/us-spurs-site
          paths:
            - .

  # ---------------------------------------------------------------------------
  # typecheck_and_lint — fast static checks, no build artifacts required
  # ---------------------------------------------------------------------------
  typecheck_and_lint:
    executor: node-executor
    steps:
      - attach_and_prepare
      - run:
          name: TypeScript type check (tsc --noEmit)
          command: npm run typecheck
      - run:
          name: Source policy lint (scripts/source-policy.mjs)
          command: npm run lint

  # ---------------------------------------------------------------------------
  # build — Next.js static export (next build → out/)
  # ---------------------------------------------------------------------------
  build:
    executor: node-executor
    steps:
      - attach_and_prepare
      - run:
          name: Next.js static export build
          command: npm run build
      - run:
          name: Verify static export output exists
          command: |
            if [ ! -d "out" ] || [ ! -f "out/index.html" ]; then
              echo "ERROR: 'out/' (or out/index.html) not produced by 'next build'." >&2
              echo "Confirm next.config.mjs still sets output: 'export'." >&2
              exit 1
            fi
            echo "Static export contents:"
            find out -maxdepth 2 -type f | sort
      - persist_to_workspace:
          root: ~/us-spurs-site
          paths:
            - out
      - store_artifacts:
          path: out
          destination: static-export

  # ---------------------------------------------------------------------------
  # link_and_artifact_check — integrity of the built static site
  # ---------------------------------------------------------------------------
  link_and_artifact_check:
    executor: node-executor
    steps:
      - attach_and_prepare
      - run:
          name: Validate internal/external links (scripts/check-links.mjs)
          command: npm run check:links
      - run:
          name: Validate required build artifacts (scripts/check-artifacts.mjs)
          command: npm run check:artifacts

  # ---------------------------------------------------------------------------
  # e2e_tests — Playwright (chromium) + @axe-core/playwright accessibility
  # ---------------------------------------------------------------------------
  e2e_tests:
    executor: node-executor
    resource_class: large
    steps:
      - attach_and_prepare
      - restore_cache:
          keys:
            - v1-playwright-chromium-{{ checksum "package-lock.json" }}
      - run:
          name: Install Playwright Chromium + required OS dependencies
          command: npx playwright install --with-deps chromium
      - save_cache:
          key: v1-playwright-chromium-{{ checksum "package-lock.json" }}
          paths:
            - ~/.cache/ms-playwright
      - run:
          name: Serve static export on 127.0.0.1:4173
          command: npx --yes serve -l 4173 out
          background: true
      - run:
          name: Wait for static server to become ready
          command: |
            for i in $(seq 1 30); do
              if curl --output /dev/null --silent --fail http://127.0.0.1:4173; then
                echo "Static server is ready."
                exit 0
              fi
              echo "Waiting for static server... ($i/30)"
              sleep 1
            done
            echo "ERROR: static server on :4173 did not become ready in time." >&2
            exit 1
      - run:
          name: Run Playwright E2E + accessibility suite (npm run test:e2e)
          command: npm run test:e2e
      - store_artifacts:
          path: test-results
          destination: test-results
      - store_artifacts:
          path: playwright-report
          destination: playwright-report

workflows:
  version: 2

  # Runs on every push, on every branch, for every PR.
  validate:
    jobs:
      - setup
      - typecheck_and_lint:
          requires:
            - setup
      - build:
          requires:
            - setup
      - link_and_artifact_check:
          requires:
            - build
      - e2e_tests:
          requires:
            - build

  # Nightly re-validation of `main` only — catches external link rot and
  # third-party regressions that wouldn't otherwise surface between pushes.
  nightly-main-revalidation:
    triggers:
      - schedule:
          cron: "0 13 * * *" # 13:00 UTC daily
          filters:
            branches:
              only:
                - main
    jobs:
      - setup
      - typecheck_and_lint:
          requires:
            - setup
      - build:
          requires:
            - setup
      - link_and_artifact_check:
          requires:
            - build
      - e2e_tests:
          requires:
            - build
